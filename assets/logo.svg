<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150">
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFF8DC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DAA520;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Ant Silhouette Icon -->
  <path d="M50 75 C 50 60 70 60 70 75 C 70 90 90 90 90 75 C 90 50 110 50 110 75 C 110 100 80 100 80 120" stroke="url(#gold-grad)" stroke-width="5" fill="none" transform="rotate(-15 80 75)"/>
  
  <!-- Text -->
  <text x="130" y="90" font-family="'Arial Black', sans-serif" font-size="50" fill="url(#gold-grad)" filter="url(#glow)" font-weight="900" letter-spacing="-2">
    EL HORMIGUERO
  </text>
  <text x="320" y="50" font-family="'Arial Black', sans-serif" font-size="30" fill="#fff" font-weight="bold">3.0</text>
</svg>
