<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150">
  <!-- Trancas (Unibrow) -->
  <g id="trancas" transform="translate(10, 20)">
    <circle cx="40" cy="40" r="35" fill="#5D2688" />
    <!-- Eyes -->
    <circle cx="25" cy="35" r="10" fill="white" />
    <circle cx="25" cy="35" r="3" fill="black" />
    <circle cx="55" cy="35" r="10" fill="white" />
    <circle cx="55" cy="35" r="3" fill="black" />
    <!-- Unibrow -->
    <path d="M15 20 Q 40 30 65 20" stroke="black" stroke-width="5" fill="none" />
    <!-- Teeth -->
    <rect x="35" y="55" width="10" height="10" fill="white" />
  </g>
  
  <!-- Barrancas -->
  <g id="barrancas" transform="translate(110, 20)">
    <circle cx="40" cy="40" r="35" fill="#5D2688" />
    <!-- Eyes -->
    <circle cx="25" cy="35" r="10" fill="white" />
    <circle cx="25" cy="35" r="3" fill="black" />
    <circle cx="55" cy="35" r="10" fill="white" />
    <circle cx="55" cy="35" r="3" fill="black" />
    <!-- Tooth -->
    <rect x="35" y="55" width="10" height="10" fill="white" />
  </g>
</svg>
