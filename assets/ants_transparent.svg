<svg width="300" height="200" viewBox="0 0 300 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Group: Trancas (Left) -->
  <g transform="translate(10, 20) rotate(-10)">
     <!-- Antennae -->
     <path d="M50 40 Q 30 0 10 20" stroke="black" stroke-width="3" fill="none"/>
     <circle cx="10" cy="20" r="3" fill="black"/>
     <path d="M80 40 Q 100 0 120 20" stroke="black" stroke-width="3" fill="none"/>
     <circle cx="120" cy="20" r="3" fill="black"/>
     
     <!-- Head -->
     <ellipse cx="65" cy="80" rx="55" ry="60" fill="#9b59b6" stroke="black" stroke-width="2"/>
     
     <!-- Eyes -->
     <circle cx="45" cy="65" r="18" fill="white" stroke="black" stroke-width="1"/>
     <circle cx="45" cy="65" r="5" fill="black"/> <!-- Pupil -->
     
     <circle cx="85" cy="60" r="22" fill="white" stroke="black" stroke-width="1"/>
     <circle cx="85" cy="60" r="4" fill="black"/> <!-- Pupil -->
     
     <!-- Unibrow -->
     <path d="M25 45 Q 65 55 105 40" stroke="black" stroke-width="4" fill="none"/>
     
     <!-- Mouth (Open/Talking style) -->
     <path d="M35 100 Q 65 130 95 100" fill="#c0392b" stroke="black" stroke-width="1"/> <!-- Lower lip area/inside -->
     <rect x="55" y="100" width="10" height="10" fill="white" rx="2"/> <!-- Tooth -->
     <rect x="70" y="100" width="10" height="8" fill="white" rx="2"/> <!-- Tooth -->
  </g>

  <!-- Group: Barrancas (Right) -->
  <g transform="translate(160, 30) rotate(10)">
     <!-- Antennae -->
     <path d="M40 40 Q 20 0 10 30" stroke="black" stroke-width="3" fill="none"/>
     <circle cx="10" cy="30" r="3" fill="black"/>
     <path d="M80 40 Q 100 0 120 30" stroke="black" stroke-width="3" fill="none"/>
     <circle cx="120" cy="30" r="3" fill="black"/>
     
     <!-- Head (Slightly flatter) -->
     <ellipse cx="60" cy="85" rx="60" ry="55" fill="#af7ac5" stroke="black" stroke-width="2"/>
     
     <!-- Eyes -->
     <circle cx="40" cy="65" r="20" fill="white" stroke="black" stroke-width="1"/>
     <circle cx="40" cy="65" r="5" fill="black"/>
     
     <circle cx="80" cy="65" r="16" fill="white" stroke="black" stroke-width="1"/>
     <circle cx="80" cy="65" r="4" fill="black"/>
     
     <!-- Unibrow -->
     <path d="M20 40 L 50 50 L 80 40" stroke="black" stroke-width="4" fill="none"/>
     
     <!-- Mouth (Wide) -->
     <ellipse cx="60" cy="110" rx="30" ry="10" fill="#e74c3c" stroke="black" stroke-width="1"/>
     <rect x="55" y="105" width="12" height="12" fill="white"/> <!-- Big Tooth -->
  </g>
</svg>
